version: '3.9'

services:
  sut:
    build:
      context: ./services/sut
      dockerfile: Dockerfile
    image: loadtest/sut:latest
    container_name: sut
    ports:
      - "${SUT_PORT:-3000}:3000"
    environment:
      PORT: 3000
      SLOW_DELAY_MS: ${SLOW_DELAY_MS:-200}
      FIB_N: ${FIB_N:-35}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    depends_on:
      - sut
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
  # ── Phase 2: Postgres ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-loadtest}
      POSTGRES_USER:     ${POSTGRES_USER:-loadtest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loadtest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile
    image: loadtest/control-api:latest
    container_name: control-api
    ports:
      - "${CONTROL_API_PORT:-4000}:4000"
    environment:
      PORT:           4000
      DATABASE_URL:   postgresql://${POSTGRES_USER:-loadtest}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-loadtest}
      REDIS_URL:      redis://redis:6379
      JWT_SECRET:     ${JWT_SECRET}
      API_KEY:        ${API_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      MAX_VUS:        ${MAX_VUS:-500}
      MAX_DURATION_S: ${MAX_DURATION_S:-3600}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  # ── Phase 3 worker — queue driven consumer ─────────────────────────────────
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    image: loadtest/worker:latest
    environment:
      REDIS_URL: redis://redis:6379
      CONTROL_API_URL: http://control-api:4000
      WORKER_API_KEY: ${API_KEY}
      SUT_URL: http://sut:3000
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-5000}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      WORKER_METRICS_PORT: 9464
      # k6 pushes runtime metrics to Prometheus via remote-write
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
    depends_on:
      sut:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-api:
        condition: service_healthy
    restart: "no"

  # ── Phase 7: React UI ────────────────────────────────────────────────────────
  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
    image: loadtest/ui:latest
    container_name: ui
    ports:
      - "${UI_PORT:-5173}:80"
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
