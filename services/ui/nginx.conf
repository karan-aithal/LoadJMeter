server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to control-api
  location /api/ {
    proxy_pass http://control-api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SSE live feed: no buffering, long read timeout (control-api also sends X-Accel-Buffering: no)
  location /api/ops/stream {
    proxy_pass http://control-api:4000/ops/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # SPA fallback — every unmatched route serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
