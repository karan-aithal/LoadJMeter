openapi: 3.0.3
info:
  title: Load Test Control API
  version: 1.1.0
  description: >-
    Control plane for the distributed load testing platform.


    **Roles.** UI users exchange the API key for a JWT (role `operator`) and may call the operator routes. Workers
    authenticate with the `x-api-key` header (role `worker`) and may call only the worker routes (`PATCH
    /tests/{id}/status`, `POST /tests/{id}/heartbeat`). The other role gets 403.


    **Fencing.** `test_runs.epoch` is a fencing token. A worker running attempt *n* sends epoch *n* on every write; the
    API answers 409 `fenced` once the reaper or a newer attempt owns the run.
servers:
  - url: http://localhost:4000
    description: Local
tags:
  - name: Auth
  - name: Tests
    description: Operator routes
  - name: Worker
    description: Internal, worker-only (x-api-key)
  - name: Ops
    description: 'Dashboard: queues, dead-letter, live feed, chaos results (operator)'
  - name: Health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Fenced:
      type: object
      properties:
        error:
          type: string
          enum:
            - fenced
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          description: Current status of the run
        epoch:
          type: integer
          description: Current epoch of the run (the writer's must be >= this)
    TestConfig:
      type: object
      required:
        - scenario
        - vus
        - duration
      properties:
        scenario:
          type: string
          enum:
            - base
            - fast
            - slow
            - cpu-heavy
        vus:
          type: integer
          minimum: 1
          maximum: 500
          description: Capped by MAX_VUS
        duration:
          type: string
          pattern: ^[1-9][0-9]*(s|m|h)$
          example: 30s
          description: Capped by MAX_DURATION_S
        rampUp:
          type: string
          pattern: ^[1-9][0-9]*(s|m|h)$
        rampDown:
          type: string
          pattern: ^[1-9][0-9]*(s|m|h)$
        sutUrl:
          type: string
          format: uri
    TestRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
        config:
          $ref: '#/components/schemas/TestConfig'
        verdict:
          type: string
          enum:
            - PASS
            - FAIL
            - INCONCLUSIVE
          nullable: true
        worker_id:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        epoch:
          type: integer
          description: Fencing token, only ever increases
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Doubles as the worker heartbeat timestamp
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    TestRunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestRun'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    QueueItem:
      type: object
      description: 'A parsed Redis queue entry. Unparseable entries come back as `{id: null, raw}`.'
      properties:
        id:
          type: string
          nullable: true
        attempt:
          type: integer
        scenario:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        deadLetterReason:
          type: string
          nullable: true
        deadLetteredAt:
          type: string
          format: date-time
          nullable: true
        raw:
          type: string
          description: Only for unparseable entries
    Queue:
      type: object
      properties:
        length:
          type: integer
          description: Total entries in the Redis list
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
          description: First 50 entries
    OpsSnapshot:
      type: object
      properties:
        at:
          type: string
          format: date-time
        queues:
          type: object
          properties:
            pending:
              $ref: '#/components/schemas/Queue'
            processing:
              $ref: '#/components/schemas/Queue'
            dlq:
              $ref: '#/components/schemas/Queue'
        workers:
          type: array
          description: Workers with a running job (derived from running rows)
          items:
            type: object
            properties:
              workerId:
                type: string
              runId:
                type: string
              epoch:
                type: integer
              lastHeartbeat:
                type: string
                format: date-time
        fleet:
          type: array
          description: Every live worker (idle or busy) from its Redis presence key
          items:
            $ref: '#/components/schemas/FleetWorker'
        settings:
          $ref: '#/components/schemas/OpsSettings'
        reaper:
          type: object
          properties:
