        counters:
          type: object
          description: In-process, reset on API restart
          properties:
            reaped_total:
              type: integer
            fenced_writes_total:
              type: integer
    OpsSettings:
      type: object
      description: Runtime settings shared with the workers (Redis hash ops:settings); env vars are the defaults
      properties:
        reaperPaused:
          type: boolean
        intakePaused:
          type: boolean
        reaperStaleMs:
