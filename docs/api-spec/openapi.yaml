            - k8s
          description: Set when real-infra chaos is configured and enabled
    FleetWorker:
      type: object
      properties:
        workerId:
          type: string
        state:
          type: string
          enum:
            - idle
            - busy
            - paused
            - draining
            - partitioned
            - unknown
        runId:
          type: string
          nullable: true
        paused:
          type: boolean
        draining:
          type: boolean
        pid:
          type: integer
        lastSeen:
          type: integer
          description: epoch ms
        ageMs:
          type: integer
        stale:
          type: boolean
          description: 'No presence update for 6s: crashed or cut off'
        partitionedUntil:
          type: integer
          nullable: true
    AuditEntry:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        detail:
          type: object
          additionalProperties: true
        result:
          type: string
          enum:
            - ok
            - rejected
            - failed
    Stats:
      type: object
      description: Nearest-rank percentiles
      properties:
        min:
          type: number
          nullable: true
        p50:
          type: number
          nullable: true
        p95:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
    ChaosResults:
      type: object
      properties:
        runs:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'One result file: the script''s own fields (result, mttr_seconds, ...) plus `file` and `kind`.'
            properties:
              file:
                type: string
              kind:
                type: string
              result:
                type: string
                enum:
                  - PASS
                  - FAIL
        summary:
          type: object
          nullable: true
          description: null when the results directory is missing or empty
          properties:
            runs:
              type: integer
            passed:
              type: integer
            lost_jobs:
              type: integer
            duplicate_completions:
              type: integer
            mttr_seconds:
              $ref: '#/components/schemas/Stats'
            completion_seconds:
              $ref: '#/components/schemas/Stats'
            git_shas:
              type: array
              items:
                type: string
              description: More than one means the runs mix code versions
        dir:
          type: string
paths:
  /healthz:
    get:
      summary: Liveness
      tags:
        - Health
      responses:
        '200':
          description: Alive
  /readyz:
    get:
      summary: Readiness (checks the database)
      tags:
        - Health
      responses:
        '200':
          description: Ready
        '503':
          description: Database unreachable
  /metrics:
    get:
      summary: Prometheus metrics (reaped and fenced-write counters)
      tags:
        - Health
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /auth/token:
    post:
      summary: Issue JWT (role operator)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKey
              properties:
                apiKey:
                  type: string
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid API key
        '500':
          description: Server misconfiguration
  /tests:
    post:
      summary: Create test run
      tags:
        - Tests
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConfig'
      responses:
        '200':
          description: Idempotent return (key already used)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '201':
          description: Created and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '400':
          description: Validation error (or missing Idempotency-Key)
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List test runs (newest first)
      tags:
        - Tests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunList'
        '401':
          description: Unauthorized
  /tests/{id}:
    get:
      summary: Get test run
      tags:
        - Tests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      summary: Cancel test run
      tags:
        - Tests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: >-
        Sets a cancel tombstone and marks the run cancelled. A running worker learns of it when its next heartbeat gets
        409.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Cannot cancel (already terminal, or it just finished)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tests/{id}/retry:
    post:
      summary: Re-run a finished run as a NEW run
      tags:
        - Tests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: >-
        Copies the config of a completed, failed or cancelled run into a new run (new id, epoch 0) and enqueues it. The
        original row is left untouched.
      responses:
        '201':
          description: New run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Not found
        '409':
          description: Run is still pending or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tests/{id}/status:
    patch:
      summary: Worker status update (fenced)
      tags:
        - Worker
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: >-
        Applied only if the run is not terminal and `epoch` >= the row's epoch. `nextEpoch` (default: `epoch`) is
        stored, so a worker re-queueing its job passes epoch+1 to fence itself out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - running
                    - completed
                    - failed
                    - cancelled
                verdict:
                  type: string
                  enum:
                    - PASS
                    - FAIL
                    - INCONCLUSIVE
                  nullable: true
                workerId:
                  type: string
                errorMessage:
                  type: string
                  nullable: true
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                epoch:
                  type: integer
                  description: The writer's fencing token (its attempt number)
                nextEpoch:
                  type: integer
      responses:
        '200':
          description: Updated run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Not found
        '409':
          description: 'Fenced: the run is terminal or the writer''s epoch is stale. The worker must stop acting on this job.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fenced'
  /tests/{id}/heartbeat:
    post:
      summary: Worker heartbeat (fenced)
      tags:
        - Worker
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: 'Bumps `updated_at`, which the reaper reads as liveness. A 409 means stop: cancel k6 and walk away.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workerId:
                  type: string
                epoch:
                  type: integer
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  id:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Not found
        '409':
          description: 'Fenced: the run is terminal or the writer''s epoch is stale. The worker must stop acting on this job.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fenced'
  /ops/queues:
    get:
      summary: Queue, worker and counter snapshot
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot (same payload as a stream event)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSnapshot'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ops/stream:
    get:
      summary: Live snapshot feed (Server-Sent Events)
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: >-
        Emits an `OpsSnapshot` as a `data:` frame every OPS_STREAM_MS (default 2000). On a snapshot error it emits an
        `event: failure` frame and keeps going. Browsers' EventSource cannot set headers, so the JWT may be passed as
        `?token=` instead of the Authorization header.
      parameters:
        - in: query
          name: token
          required: false
          schema:
            type: string
          description: JWT, alternative to the Authorization header
        - in: query
          name: ms
          required: false
          schema:
            type: integer
            minimum: 500
            maximum: 60000
          description: Frame interval for this connection (default OPS_STREAM_MS)
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/dlq/{id}/requeue:
    post:
      summary: Requeue a dead-lettered job as a NEW run
      tags:
        - Ops
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: >-
        `id` is the job id in jobs:dead-letter. The entry is removed and its config launched as a new run (fresh
        retries); if the relaunch fails the entry is put back.
      responses:
        '201':
          description: New run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Not in the dead-letter queue
        '409':
          description: Already handled by another request
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ops/dlq/{id}:
    delete:
      summary: Purge one dead-letter entry
      tags:
        - Ops
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Not in the dead-letter queue
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ops/settings:
    get:
      summary: Runtime settings with their limits
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current values, schema (min/max/default) and capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    $ref: '#/components/schemas/OpsSettings'
                  schema:
                    type: object
                    additionalProperties: true
                  capabilities:
                    $ref: '#/components/schemas/Capabilities'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
    put:
      summary: Change runtime settings
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: >-
        Partial update, validated against the schema. The reaper applies it on its next pass, workers within ~2s
        (heartbeat interval from the next job). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsSettings'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    $ref: '#/components/schemas/OpsSettings'
        '400':
          description: Unknown key or out-of-range value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/reaper/run:
    post:
      summary: Run one reaper pass now
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: Works while the reaper is paused. Audited.
      responses:
        '200':
          description: Jobs requeued or dead-lettered
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaped:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/queues/pending/purge:
    post:
      summary: Cancel and drop up to 200 pending jobs
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: Each job is cancelled like `DELETE /tests/{id}` so no run stays pending. Audited.
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/queues/dlq/purge:
    post:
      summary: Purge up to 200 dead-letter entries
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/queues/dlq/requeue:
    post:
      summary: Requeue up to 200 dead-letter entries as new runs
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  requeued:
                    type: integer
                  runs:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/workers:
    get:
      summary: Live worker fleet (idle and busy)
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workers seen in the last minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  workers:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetWorker'
                  capabilities:
                    $ref: '#/components/schemas/Capabilities'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/workers/{id}/{cmd}:
    post:
      summary: Send a command to one worker (or `*` for all)
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: >-
        `pause` / `resume` stop and start job intake. `drain` (finish the job, then exit), `crash` (exit immediately)
        and `partition` (heartbeats and status writes fail for `seconds`, 5-300, default 30) need CHAOS_ENABLED=true on
        the API. Audited.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: cmd
          required: true
          schema:
            type: string
            enum:
              - pause
              - resume
              - drain
              - crash
              - partition
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: integer
                  minimum: 5
                  maximum: 300
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: string
                  target:
                    type: string
                  receivers:
                    type: integer
        '400':
          description: Bad command or seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Unknown worker
  /ops/infra:
    get:
      summary: Worker containers/pods the chaos driver can act on
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Driver and its workers (empty when no driver is enabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver:
                    type: string
                    nullable: true
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        state:
                          type: string
                        status:
                          type: string
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/infra/{action}:
    post:
      summary: Real infrastructure chaos on a worker
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: >-
        Needs CHAOS_ENABLED=true plus a configured CHAOS_DRIVER. `docker`: kill, start, restart, partition (disconnect
        from its networks for `seconds`, then reconnect), heal. `k8s`: kill and restart only (501 otherwise). The target
        must be one of the driver's listed workers. Audited.
      parameters:
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum:
              - kill
              - start
              - restart
              - partition
              - heal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target
              properties:
                target:
                  type: string
                seconds:
                  type: integer
                  minimum: 5
                  maximum: 300
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
                    nullable: true
                    additionalProperties: true
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
        '404':
          description: Not a worker managed by the driver
        '501':
          description: No driver, or action unsupported by it
        '502':
          description: Driver call failed
  /ops/audit:
    get:
      summary: Operator action log (newest first, last 100)
      tags:
        - Ops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
  /ops/chaos:
    get:
      summary: Recorded chaos / recovery runs and their summary
      tags:
        - Ops
      security:
        - bearerAuth: []
      description: Read-only view of the JSON files in RESULTS_DIR (docs/benchmarks/results).
      responses:
        '200':
          description: Runs and aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChaosResults'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden: wrong role for this route'
