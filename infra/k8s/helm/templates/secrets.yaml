# Secrets are never committed with real values.
# Pass at deploy time:
#   helm upgrade --install loadtest ./helm \
#     --set secrets.jwtSecret=$(openssl rand -hex 32) \
#     --set secrets.apiKey=$(openssl rand -hex 16) \
#     --set secrets.postgresPassword=changeme
apiVersion: v1
kind: Secret
metadata:
  name: loadtest-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET:        {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  API_KEY:           {{ required "secrets.apiKey is required" .Values.secrets.apiKey | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  DATABASE_URL:      {{ printf "postgresql://%s:%s@postgres:%d/%s" (.Values.postgres.username | default "loadtest") .Values.secrets.postgresPassword (int .Values.postgres.port) .Values.postgres.database | quote }}
