# Namespace-level LimitRange: pods without explicit limits get safe defaults.
apiVersion: v1
kind: LimitRange
metadata:
  name: loadtest-limits
  namespace: {{ .Values.global.namespace }}
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 1Gi
