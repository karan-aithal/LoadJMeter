# Workers can reach: SUT, Redis, Control API.
# Nothing else. Egress DNS (port 53) always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: sut
    - to:
        - podSelector:
            matchLabels:
              app: redis
    - to:
        - podSelector:
            matchLabels:
              app: control-api
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
---
# SUT only accepts ingress from worker and control-api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sut-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: sut
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: worker
        - podSelector:
            matchLabels:
              app: prometheus
