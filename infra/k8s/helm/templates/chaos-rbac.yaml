{{- if and .Values.chaos.enabled .Values.chaos.realKill }}
# Lets control-api list and delete WORKER pods only (the dashboard's real-kill chaos). Off by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-api-chaos
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-api-chaos
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-api-chaos
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: control-api-chaos
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: control-api-chaos
  apiGroup: rbac.authorization.k8s.io
{{- end }}
