apiVersion: apps/v1
kind: Deployment
metadata:
  name: sut
  namespace: {{ .Values.global.namespace }}
  labels:
    app: sut
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.sut.replicas }}
  selector:
    matchLabels:
      app: sut
  template:
    metadata:
      labels:
        app: sut
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: sut
          image: {{ .Values.sut.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.sut.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.sut.port | quote }}
          envFrom:
            - configMapRef:
                name: loadtest-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sut.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.sut.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.sut.resources.requests.cpu }}
              memory: {{ .Values.sut.resources.requests.memory }}
            limits:
              cpu: {{ .Values.sut.resources.limits.cpu }}
              memory: {{ .Values.sut.resources.limits.memory }}
