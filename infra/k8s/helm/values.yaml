# -- Global ------------------------------------------------------------------
global:
  namespace: loadtest-system
  imagePullPolicy: IfNotPresent

# -- SUT ---------------------------------------------------------------------
sut:
  image: loadtest/sut:latest
  port: 3000
  slowDelayMs: "200"
  fibN: "35"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# -- Control API --------------------------------------------------------------
controlApi:
  image: loadtest/control-api:latest
  port: 4000
  maxVus: "500"
  maxDurationS: "3600"
  jwtExpiresIn: "24h"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# -- Worker -------------------------------------------------------------------
worker:
  image: loadtest/worker:latest
  metricsPort: 9464
  heartbeatIntervalMs: "5000"
  maxRetries: "3"
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 512Mi }

# -- Postgres -----------------------------------------------------------------
postgres:
  image: postgres:16-alpine
  port: 5432
  database: loadtest
  storageSize: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# -- Redis ---------------------------------------------------------------------
redis:
  image: redis:7.2-alpine
  port: 6379
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# -- Prometheus ----------------------------------------------------------------
prometheus:
  image: prom/prometheus:v2.49.1
  port: 9090
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# -- Grafana -------------------------------------------------------------------
grafana:
  image: grafana/grafana:10.2.3
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# -- Alertmanager --------------------------------------------------------------
alertmanager:
  image: prom/alertmanager:v0.27.0
  port: 9093
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }
