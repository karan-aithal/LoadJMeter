apiVersion: v1
kind: LimitRange
metadata:
  name: loadtest-limits
spec:
  limits:
    - type: Container
      default:        { cpu: 200m, memory: 256Mi }
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      max:            { cpu: "2",  memory: 2Gi }   # 2Gi: image builds (npm ci / vite build) run in this namespace
