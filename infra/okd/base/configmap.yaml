apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-config
data:
  REDIS_URL: redis://redis:6379
  CONTROL_API_URL: http://control-api:4000
  SUT_URL: http://sut:3000
  SLOW_DELAY_MS: "200"
  FIB_N: "35"
  MAX_VUS: "500"
  MAX_DURATION_S: "3600"
  JWT_EXPIRES_IN: 24h
  HEARTBEAT_INTERVAL_MS: "5000"
  MAX_RETRIES: "3"
  WORKER_METRICS_PORT: "9464"
  # reaper (control-api): worst-case recovery ~ STALE + INTERVAL
  REAPER_STALE_MS: "20000"
  REAPER_INTERVAL_MS: "5000"
  # K6_PROMETHEUS_RW_SERVER_URL intentionally unset: no Prometheus in v1, and the
  # worker adds `--out experimental-prometheus-rw` whenever it is set.
