apiVersion: apps/v1
kind: Deployment
metadata:
  name: sut
  labels: { app: sut }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sut }
  template:
    metadata:
      labels: { app: sut }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sut
          image: image-registry.openshift-image-registry.svc:5000/loadtest-system/sut:latest
          imagePullPolicy: Always
          ports:
            - { containerPort: 3000, name: http }
          env:
            - { name: PORT, value: "3000" }
          envFrom:
            - configMapRef: { name: loadtest-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: sut
spec:
  selector: { app: sut }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
