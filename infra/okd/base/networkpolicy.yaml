# Ingress: default deny, then same-namespace + OpenShift router.
# Egress: locked down for the two workloads that talk outward (control-api -> Postgres host, worker).
# The Postgres ipBlock must match postgres-external.yaml (PG_HOST_IP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-same-namespace }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-openshift-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: control-api-egress }
spec:
  podSelector:
    matchLabels: { app: control-api }
  policyTypes: [Egress]
  egress:
    - to:   # cluster DNS (OpenShift dns pods listen on 5353)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: openshift-dns }
      ports:
        - { protocol: UDP, port: 5353 }
        - { protocol: TCP, port: 5353 }
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app: redis }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:   # external PostgreSQL on the host
        - ipBlock: { cidr: 192.168.130.1/32 }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-egress }
spec:
  podSelector:
    matchLabels: { app: worker }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: openshift-dns }
      ports:
        - { protocol: UDP, port: 5353 }
        - { protocol: TCP, port: 5353 }
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app: redis }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels: { app: control-api }
      ports:
        - { protocol: TCP, port: 4000 }
    - to:
        - podSelector:
            matchLabels: { app: sut }
      ports:
        - { protocol: TCP, port: 3000 }
