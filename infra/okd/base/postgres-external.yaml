# PostgreSQL runs on the Linux host, outside the cluster. Apps use the stable name
# `postgres-external` (it is in the server cert SANs); only this Endpoints IP is environment-specific.
# 192.168.130.1 = CRC libvirt bridge gateway (= the host as seen from the node VM). Overridden by
# PG_HOST_IP in infra/okd/okd.env(.local); keep in sync with networkpolicy.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-external
subsets:
  - addresses:
      - ip: 192.168.130.1
    ports:
      - name: postgres
        port: 5432
