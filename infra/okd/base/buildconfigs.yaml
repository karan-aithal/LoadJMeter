# Binary Docker builds: `oc start-build <name> --from-dir=services/<name> --follow`.
# No registry push from the workstation, so no Docker insecure-registry / daemon restart needed.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: control-api }
spec:
  source: { type: Binary }
  strategy: { type: Docker, dockerStrategy: {} }
  output: { to: { kind: ImageStreamTag, name: "control-api:latest" } }
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: worker }
spec:
  source: { type: Binary }
  strategy: { type: Docker, dockerStrategy: {} }
  output: { to: { kind: ImageStreamTag, name: "worker:latest" } }
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: sut }
spec:
  source: { type: Binary }
  strategy: { type: Docker, dockerStrategy: {} }
  output: { to: { kind: ImageStreamTag, name: "sut:latest" } }
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ui }
spec:
  source: { type: Binary }
  strategy: { type: Docker, dockerStrategy: {} }
  output: { to: { kind: ImageStreamTag, name: "ui:latest" } }
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
