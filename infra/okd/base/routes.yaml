apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: control-api
spec:
  to: { kind: Service, name: control-api }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ui
spec:
  to: { kind: Service, name: ui }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
