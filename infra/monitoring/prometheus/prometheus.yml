global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: sut
    static_configs:
      - targets:
          - sut:3000
    metrics_path: /metrics
    scrape_interval: 10s
