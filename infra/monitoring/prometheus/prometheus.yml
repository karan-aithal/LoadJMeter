global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: sut
    static_configs:
      - targets:
          - sut:3000
    metrics_path: /metrics
    scrape_interval: 10s

  # worker: use dns_sd so additional replicas (docker compose scale) are
  # discovered automatically without a config reload.
  - job_name: worker
    dns_sd_configs:
      - names:
          - tasks.worker
        type: A
        port: 9464
    metrics_path: /metrics
    scrape_interval: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: control-api
    static_configs:
      - targets:
          - control-api:4000
    metrics_path: /healthz
    scrape_interval: 15s
