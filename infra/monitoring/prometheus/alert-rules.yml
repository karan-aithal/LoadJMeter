groups:
  - name: sut-slos
    interval: 30s
    rules:
      - alert: SLOErrorRateBreach
        expr: |
          (
            rate(http_errors_total[5m])
            /
            (rate(http_requests_total[5m]) + 1e-9)
          ) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SLO error rate breach"
          description: "Error rate {{ $value | humanizePercentage }} exceeds 1% SLO"

      - alert: SLOP95FastBreach
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{route="/fast"}[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency breach on /fast (SLO 50ms)"
          description: "p95={{ $value | humanizeDuration }}"

      - alert: SLOP95SlowBreach
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{route="/slow"}[5m])
          ) > 0.4
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency breach on /slow (SLO 400ms)"
          description: "p95={{ $value | humanizeDuration }}"

      - alert: SLOP95CpuHeavyBreach
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{route="/cpu-heavy"}[5m])
          ) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency breach on /cpu-heavy (SLO 2s)"
          description: "p95={{ $value | humanizeDuration }}"

  - name: fleet
    interval: 30s
    rules:
      - alert: FleetCPUSaturation
        expr: max(worker_cpu_saturation_ratio) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Fleet CPU saturation — test results may be INCONCLUSIVE"
          description: "Max worker CPU saturation {{ $value | humanizePercentage }} > 80%"

      - alert: WorkerFleetDown
        expr: sum(up{job="worker"}) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No active worker metrics targets"
          description: "Worker fleet appears down or unreachable for >1m"

      - alert: WorkerHeartbeatFailureSpike
        expr: increase(worker_heartbeat_failures_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Worker heartbeat failure spike"
          description: "{{ $value }} heartbeat failures in last 5m — jobs may be stalling"
