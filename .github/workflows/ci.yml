name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + Unit Tests ────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sut, control-api, worker]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install deps (npmjs → Artifactory fallback)
        run: npm run deps:install
        env:
          NPM_INSTALL_CMD: ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ── Build + Trivy Scan ───────────────────────────────────────────────────────
  build-scan:
    name: Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [sut, control-api, worker, ui]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: loadtest/${{ matrix.service }}:ci
          load: true
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: loadtest/${{ matrix.service }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  # ── k6 Smoke Test ────────────────────────────────────────────────────────────
  smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: build-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/sut/package-lock.json

      - name: Install SUT deps
        run: npm ci
        working-directory: services/sut

      - name: Start SUT in background
        run: node src/index.js &
        working-directory: services/sut
        env:
          PORT: 3000
          SLOW_DELAY_MS: "200"
          FIB_N: "30"

      - name: Wait for SUT /readyz
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/readyz && echo "SUT ready" && break
            sleep 1
          done

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run k6 smoke test
        run: k6 run services/worker/scripts/k6/base-scenario.js
        env:
          SUT_URL: http://localhost:3000
          VUS: "5"
          DURATION: 20s
          RAMP_UP: 5s
          RAMP_DOWN: 5s
