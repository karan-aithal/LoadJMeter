name: k6 Scheduled Smoke Test

on:
  schedule:
    - cron: "0 6 * * 1-5"   # weekdays 06:00 UTC
  workflow_dispatch:
    inputs:
      vus:
        description: Virtual users
        default: "10"
      duration:
        description: Test duration (e.g. 30s, 2m)
        default: "30s"

jobs:
  smoke:
    name: k6 Smoke (${{ github.event.inputs.vus || '5' }} VUs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/sut/package-lock.json

      - name: Install SUT deps
        run: npm ci
        working-directory: services/sut

      - name: Start SUT
        run: node src/index.js &
        working-directory: services/sut
        env:
          PORT: 3000
          SLOW_DELAY_MS: "200"
          FIB_N: "30"

      - name: Wait for SUT /readyz
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/readyz && echo "SUT ready" && break
            sleep 1
          done

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Run k6 scenario (thresholds enforced)
        run: k6 run services/worker/scripts/k6/base-scenario.js
        env:
          SUT_URL: http://localhost:3000
          VUS: ${{ github.event.inputs.vus || '5' }}
          DURATION: ${{ github.event.inputs.duration || '30s' }}
          RAMP_UP: 5s
          RAMP_DOWN: 5s

      - name: Verify SUT /metrics scraped (sanity check)
        run: curl -sf http://localhost:3000/metrics | grep -q http_requests_total
